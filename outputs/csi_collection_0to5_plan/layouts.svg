<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="552" viewBox="0 0 1040 552" role="img" aria-labelledby="layout-title layout-desc">
      <title id="layout-title">두 책상 배치와 사람 위치를 표시하는 방법</title>
      <desc id="layout-desc">실측 도면이 아니다. A의 중앙 책상 한 개만 창문 방향으로 30cm 옮겨 B를 만든다. 의자와 장비는 고정한다.</desc>
      <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#0f766e"/></marker></defs>
      <rect width="1040" height="552" fill="#f8fafc"/>
      <g font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" fill="#172235"><g transform="translate(0,0)">
          <rect x="12" y="12" width="496" height="470" rx="15" fill="white" stroke="#cbd5e1"/>
          <text x="34" y="47" font-size="23" font-weight="700">배치 A · 기준 위치</text>
          <text x="260" y="88" text-anchor="middle" font-size="17" fill="#475569">창문 / 대형 화면 반대쪽</text>
          <path d="M65 105 H455" stroke="#38bdf8" stroke-width="5"/>
          <path d="M60 143 H440" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
          <circle cx="60" cy="143" r="6" fill="#b45309"/><circle cx="440" cy="143" r="6" fill="#b45309"/>
          <text x="60" y="130" text-anchor="middle" font-size="15">W0</text>
          <text x="440" y="130" text-anchor="middle" font-size="15">W1</text>
          <text x="250" y="132" text-anchor="middle" font-size="14" fill="#92400e">실제 통로에 2m 구간 표시</text>
          <rect x="58" y="195" width="154" height="95" rx="3" fill="#99f6e4" stroke="#0f766e"/>
          <text x="135" y="234" text-anchor="middle" font-size="20" font-weight="700">T1</text>
          <rect x="218" y="195" width="222" height="95" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
          <text x="329" y="246" text-anchor="middle" font-size="17" fill="#475569">다른 중앙 책상</text>
          <rect x="62" y="310" width="44" height="32" rx="7" fill="#cbd5e1"/><text x="84" y="333" text-anchor="middle" font-size="17">Z1</text><circle cx="84" cy="365" r="8" fill="#e2e8f0" stroke="#64748b"/><rect x="139" y="310" width="44" height="32" rx="7" fill="#cbd5e1"/><text x="161" y="333" text-anchor="middle" font-size="17">Z2</text><circle cx="161" cy="365" r="8" fill="#e2e8f0" stroke="#64748b"/><rect x="216" y="310" width="44" height="32" rx="7" fill="#cbd5e1"/><text x="238" y="333" text-anchor="middle" font-size="17">Z3</text><circle cx="238" cy="365" r="8" fill="#e2e8f0" stroke="#64748b"/><rect x="293" y="310" width="44" height="32" rx="7" fill="#cbd5e1"/><text x="315" y="333" text-anchor="middle" font-size="17">Z4</text><circle cx="315" cy="365" r="8" fill="#e2e8f0" stroke="#64748b"/><rect x="370" y="310" width="44" height="32" rx="7" fill="#cbd5e1"/><text x="392" y="333" text-anchor="middle" font-size="17">Z5</text><circle cx="392" cy="365" r="8" fill="#e2e8f0" stroke="#64748b"/>
          <text x="250" y="397" text-anchor="middle" font-size="15" fill="#475569">Z1 → Z5: 카메라 쪽부터 / 회색 점은 서는 자리</text>
          <rect x="170" y="415" width="180" height="25" rx="4" fill="#334155"/>
          <text x="260" y="434" text-anchor="middle" font-size="14" fill="white">대형 화면 쪽</text>
          <text x="260" y="465" text-anchor="middle" font-size="14" fill="#475569">의자 5개 · 바닥 Z · AP · RX는 계속 고정</text>
        </g><g transform="translate(520,0)">
          <rect x="12" y="12" width="496" height="470" rx="15" fill="white" stroke="#cbd5e1"/>
          <text x="34" y="47" font-size="23" font-weight="700">배치 B · T1 평행 이동</text>
          <text x="260" y="88" text-anchor="middle" font-size="17" fill="#475569">창문 / 대형 화면 반대쪽</text>
          <path d="M65 105 H455" stroke="#38bdf8" stroke-width="5"/>
          <path d="M60 143 H440" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
          <circle cx="60" cy="143" r="6" fill="#b45309"/><circle cx="440" cy="143" r="6" fill="#b45309"/>
          <text x="60" y="130" text-anchor="middle" font-size="15">W0</text>
          <text x="440" y="130" text-anchor="middle" font-size="15">W1</text>
          <text x="250" y="132" text-anchor="middle" font-size="14" fill="#92400e">실제 통로에 2m 구간 표시</text>
          <rect x="58" y="195" width="154" height="95" fill="none" stroke="#64748b" stroke-dasharray="5 5"/><rect x="58" y="159" width="154" height="95" rx="3" fill="#99f6e4" stroke="#0f766e"/>
          <text x="135" y="198" text-anchor="middle" font-size="20" font-weight="700">T1</text>
          <rect x="218" y="195" width="222" height="95" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
          <text x="329" y="246" text-anchor="middle" font-size="17" fill="#475569">다른 중앙 책상</text>
          <path d="M135 269 V228" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><text x="230" y="185" font-size="16" fill="#0f766e">T1만 창문 쪽 30cm</text><rect x="62" y="310" width="44" height="32" rx="7" fill="#cbd5e1"/><text x="84" y="333" text-anchor="middle" font-size="17">Z1</text><circle cx="84" cy="365" r="8" fill="#e2e8f0" stroke="#64748b"/><rect x="139" y="310" width="44" height="32" rx="7" fill="#cbd5e1"/><text x="161" y="333" text-anchor="middle" font-size="17">Z2</text><circle cx="161" cy="365" r="8" fill="#e2e8f0" stroke="#64748b"/><rect x="216" y="310" width="44" height="32" rx="7" fill="#cbd5e1"/><text x="238" y="333" text-anchor="middle" font-size="17">Z3</text><circle cx="238" cy="365" r="8" fill="#e2e8f0" stroke="#64748b"/><rect x="293" y="310" width="44" height="32" rx="7" fill="#cbd5e1"/><text x="315" y="333" text-anchor="middle" font-size="17">Z4</text><circle cx="315" cy="365" r="8" fill="#e2e8f0" stroke="#64748b"/><rect x="370" y="310" width="44" height="32" rx="7" fill="#cbd5e1"/><text x="392" y="333" text-anchor="middle" font-size="17">Z5</text><circle cx="392" cy="365" r="8" fill="#e2e8f0" stroke="#64748b"/>
          <text x="250" y="397" text-anchor="middle" font-size="15" fill="#475569">Z1 → Z5: 카메라 쪽부터 / 회색 점은 서는 자리</text>
          <rect x="170" y="415" width="180" height="25" rx="4" fill="#334155"/>
          <text x="260" y="434" text-anchor="middle" font-size="14" fill="white">대형 화면 쪽</text>
          <text x="260" y="465" text-anchor="middle" font-size="14" fill="#475569">의자 5개 · 바닥 Z · AP · RX는 계속 고정</text>
        </g>
      <text x="520" y="512" text-anchor="middle" font-size="17" font-weight="700">배치 규칙 설명용 · 실측 도면 아님 · 가구 수와 거리는 축척에 맞지 않음</text>
      <text x="520" y="539" text-anchor="middle" font-size="15">AP/RX 실제 좌표는 첫 준비 때 표시. 장비가 놓인 책상은 이동 대상에서 제외.</text>
      </g></svg>