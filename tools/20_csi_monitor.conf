# The RXPC monitor does not return EDID reliably with Linux 4.15/nouveau.
# This reduced-blanking 1080p mode was verified on HDMI-1 on 2026-09-09.
Section "Monitor"
    Identifier "CSI-HDMI-Monitor"
    Modeline "1920x1080R" 138.50 1920 1968 2000 2080 1080 1083 1088 1111 +HSync -VSync
    Option "PreferredMode" "1920x1080R"
EndSection

Section "Device"
    Identifier "CSI-Nouveau-GPU"
    Driver "modesetting"
    Option "Monitor-HDMI-1" "CSI-HDMI-Monitor"
EndSection

Section "Screen"
    Identifier "CSI-Screen"
    Device "CSI-Nouveau-GPU"
    Monitor "CSI-HDMI-Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080R" "1024x768"
    EndSubSection
EndSection
